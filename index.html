<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Endless Runner</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            z-index: 10;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
            z-index: 20;
        }
        #game-over h1 {
            margin: 0 0 10px 0;
            color: #ff4b5c;
            font-size: 36px;
        }
        #game-over p {
            font-size: 22px;
            margin: 10px 0 25px 0;
        }
        button {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #111;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:hover {
            transform: scale(1.05);
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            pointer-events: none;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>

    <div id="game-over">
        <h1>GAME OVER!</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <div id="controls-hint">Controls: Left/Right Arrows (or A/D) to move • Up Arrow (or W/Space) to Jump • Swipe on Mobile</div>

    <script>
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x16213e);
        scene.fog = new THREE.Fog(0x16213e, 15, 60);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 4.5, 8);
        camera.lookAt(0, 1, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- GAME VARIABLES ---
        const lanes = [-2.5, 0, 2.5];
        let currentLane = 1; // 0 = Left, 1 = Center, 2 = Right
        let targetX = lanes[currentLane];

        let isJumping = false;
        let velocityY = 0;
        const gravity = -0.025;
        const jumpPower = 0.45;

        let gameSpeed = 0.35;
        let score = 0;
        let isGameOver = false;

        const obstacles = [];
        const coins = [];
        let spawnTimer = 0;

        // --- PLAYER (RUNNER) ---
        const playerGeo = new THREE.BoxGeometry(0.9, 1.4, 0.9);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x00f2fe, roughness: 0.3 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 0.7, 0);
        player.castShadow = true;
        scene.add(player);

        // --- TRACK / GROUND ---
        const trackGeo = new THREE.PlaneGeometry(10, 200);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x0f3460 });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.rotation.x = -Math.PI / 2;
        track.position.z = -80;
        track.receiveShadow = true;
        scene.add(track);

        // Lane dividers
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xe94560 });
        [-1.25, 1.25].forEach(xPos => {
            const lineGeo = new THREE.PlaneGeometry(0.1, 200);
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(xPos, 0.01, -80);
            scene.add(line);
        });

        // --- SPAWN FUNCTIONS ---
        function spawnObject() {
            const laneIndex = Math.floor(Math.random() * 3);
            const xPos = lanes[laneIndex];
            const zPos = -70;

            // 70% chance obstacle, 30% chance coin
            if (Math.random() < 0.7) {
                const isTall = Math.random() > 0.7;
                const height = isTall ? 2.2 : 1.0;
                const obsGeo = new THREE.BoxGeometry(1.4, height, 1.2);
                const obsMat = new THREE.MeshStandardMaterial({ color: 0xff4b5c });
                const obs = new THREE.Mesh(obsGeo, obsMat);
                obs.position.set(xPos, height / 2, zPos);
                obs.castShadow = true;
                scene.add(obs);
                obstacles.push(obs);
            } else {
                const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.15, 16);
                const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.7, roughness: 0.2 });
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(xPos, 0.8, zPos);
                scene.add(coin);
                coins.push(coin);
            }
        }

        // --- CONTROLS (KEYBOARD & TOUCH) ---
        function moveLeft() {
            if (currentLane > 0 && !isGameOver) {
                currentLane--;
                targetX = lanes[currentLane];
            }
        }

        function moveRight() {
            if (currentLane < 2 && !isGameOver) {
                currentLane++;
                targetX = lanes[currentLane];
            }
        }

        function jump() {
            if (!isJumping && !isGameOver) {
                isJumping = true;
                velocityY = jumpPower;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') jump();
        });

        // Mobile Swipe Controls
        let touchStartX = 0;
        let touchStartY = 0;
        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });

        window.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].screenX - touchStartX;
            let dy = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) moveRight();
                else if (dx < -30) moveLeft();
            } else {
                if (dy < -30) jump();
            }
        });

        // --- COLLISION & RESET ---
        function checkCollision(obj1, obj2) {
            const box1 = new THREE.Box3().setFromObject(obj1);
            const box2 = new THREE.Box3().setFromObject(obj2);
            // Slightly shrink hitbox for fair gameplay
            box1.expandByScalar(-0.1);
            box2.expandByScalar(-0.1);
            return box1.intersectsBox(box2);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = Math.floor(score);
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            coins.forEach(coin => scene.remove(coin));
            obstacles.length = 0;
            coins.length = 0;

            currentLane = 1;
            targetX = lanes[currentLane];
            player.position.set(0, 0.7, 0);
            isJumping = false;
            velocityY = 0;
            gameSpeed = 0.35;
            score = 0;
            isGameOver = false;

            document.getElementById('score').innerText = '0';
            document.getElementById('game-over').style.display = 'none';
        }

        // --- MAIN GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                // Smooth lane switching
                player.position.x += (targetX - player.position.x) * 0.2;

                // Jump physics
                if (isJumping) {
                    player.position.y += velocityY;
                    velocityY += gravity;
                    if (player.position.y <= 0.7) {
                        player.position.y = 0.7;
                        isJumping = false;
                        velocityY = 0;
                    }
                } else {
                    // Subtle running bounce effect
                    player.position.y = 0.7 + Math.abs(Math.sin(Date.now() * 0.015)) * 0.1;
                }

                // Spawn logic
                spawnTimer++;
                if (spawnTimer > Math.max(25, 55 - gameSpeed * 30)) {
                    spawnObject();
                    spawnTimer = 0;
                }

                // Move & check obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += gameSpeed;

                    if (checkCollision(player, obs)) {
                        triggerGameOver();
                    }

                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Move & check coins
                for (let i = coins.length - 1; i >= 0; i--) {
                    let coin = coins[i];
                    coin.position.z += gameSpeed;
                    coin.rotation.z += 0.05;

                    if (checkCollision(player, coin)) {
                        score += 50;
                        scene.remove(coin);
                        coins.splice(i, 1);
                        continue;
                    }

                    if (coin.position.z > 10) {
                        scene.remove(coin);
                        coins.splice(i, 1);
                    }
                }

                // Increase score & speed gradually
                score += 0.2;
                gameSpeed += 0.0001;
                document.getElementById('score').innerText = Math.floor(score);
            }

            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
